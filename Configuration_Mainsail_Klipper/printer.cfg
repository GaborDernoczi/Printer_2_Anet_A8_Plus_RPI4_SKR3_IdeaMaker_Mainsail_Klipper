# This file contains common pin mappings for the BigTreeTech SKR 3.
# This board can ship with one of two chips, STM32H743 or STM32H723.
# To use this config, during "make menuconfig" enable "low-level
# options", "STM32H743" or "STM32H723", "128KiB bootloader",
# and "25MHz clock".

# See docs/Config_Reference.md for a description of parameters.

##################################################################   PRINTER_2   Raspberry 4 & SKR3  ##############################################################


[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h743xx_38003A001751313238353730-if00

[stepper_x]
step_pin: PD4
dir_pin: !PD3
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC1
position_endstop: 0
position_max: 300
homing_speed: 50

[stepper_y]
step_pin: PA15
dir_pin: PA8
enable_pin: !PD1
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC3
position_endstop: 0
position_max: 300
homing_speed: 50

[stepper_z]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PE0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop #^!PC0
#position_endstop: 0.0
position_max: 300
#position_min: -0.5

[extruder]
step_pin: PD15
dir_pin: PD14
enable_pin: !PC7
microsteps: 16
rotation_distance: 35.845
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 150
heater_pin: PB3
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA2
#control: pid
#pid_Kp: 18
#pid_Ki: 0.8
#pid_Kd: 160
min_temp: 10
max_temp: 250
# Kell a 100 mm-es extruder kalibraciohoz (alapertek csak 50 mm)
max_extrude_only_distance: 150
# Sarok-megfolyas ellen. Direct drive kiindulas ~0.03-0.08, Bowden ~0.4-0.8.
# Kalibralas utan (SET_PRESSURE_ADVANCE teszt) ird at!
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040

#[extruder1]
#step_pin: PD11
#dir_pin: PD10
#enable_pin: !PD13
#heater_pin: PB4
#sensor_pin: PA3
#...

#[verify_heater extruder]
#max_error: 120
#check_gain_time: 50
#hysteresis: 2
#heating_gain: 1

[heater_bed]
heater_pin: PD7
sensor_type: Generic 3950
sensor_pin: PA1
#control: watermark
min_temp: 5
max_temp: 130

[fan]
pin: PB7   #model cooler part-fan

[heater_fan fan]
pin: PB6   #ALU block cooler fan1

[heater_fan fan2]
pin: PB5  #ALU block cooler fan2

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 1500
max_z_velocity: 5
max_z_accel: 100

[bltouch]
sensor_pin: ^PC13  
control_pin: PE5
pin_move_time: 0.7
x_offset: -30
y_offset: -25
#z_offset: 2.2

samples: 2
samples_result: average
samples_tolerance: 0.05
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 150,150   # bed közepe (300x300-nál ez tökéletes)
speed: 20
z_hop: 10
z_hop_speed: 5

[bed_mesh]
mesh_min: 35, 35
mesh_max: 255, 255
probe_count: 5,5
algorithm: bicubic
speed: 80
horizontal_move_z: 5
fade_start: 1
fade_end: 10

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PC5, EXP1_3=PB1, EXP1_5=PE9,  EXP1_7=PE11, EXP1_9=<GND>,
    EXP1_2=PB0, EXP1_4=PE8, EXP1_6=PE10, EXP1_8=PE12, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PA6, EXP2_3=PE7, EXP2_5=PB2, EXP2_7=PC4,   EXP2_9=<GND>,
    EXP2_2=PA5, EXP2_4=PA4, EXP2_6=PA7, EXP2_8=<RST>, EXP2_10=<NC>

# See the sample-lcd.cfg file for definitions of common LCD displays.

########################################

# TMC2209 configuration

[tmc2209 stepper_x]
uart_pin: PD5
run_current: 0.800
#diag_pin:

[tmc2209 stepper_y]
uart_pin: PD0
run_current: 0.800
#diag_pin:

[tmc2209 stepper_z]
uart_pin: PE1
run_current: 0.800
#diag_pin:

[tmc2209 extruder]
uart_pin: PC6
run_current: 0.600
#diag_pin:

#[tmc2209 extruder]
#uart_pin: PD12
#run_current: 0.600
#diag_pin:

